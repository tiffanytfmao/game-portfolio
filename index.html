<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages SPA redirect: decode the path that 404.html encoded, and
         restore it before React Router initializes so deep links resolve. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Root-relative, not ./ — after 404.html restores a deep link such as
         /projects/cocoon, a relative href would look in /projects/images/. -->
    <link rel="icon" type="image/svg+xml" href="/images/icon.svg" />
    <title>Tiffany Mao — Product Designer</title>
    <meta name="description" content="Tiffany Mao is a product designer at Astrocade who designs digital products, games, and experiences built for play, and builds the front-end that ships them." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tiffany Mao — Product Designer" />
    <meta property="og:description" content="I design digital products, games, and experiences built for play." />
    <meta name="twitter:card" content="summary" />
    <!-- Satoshi is self-hosted from /public/fonts/satoshi — no webfont CDN. -->
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/satoshi/Satoshi-500.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/satoshi/Satoshi-400.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
