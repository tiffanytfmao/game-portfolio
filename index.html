<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages SPA redirect: decode the path that 404.html encoded, and
         restore it before React Router initializes so deep links resolve. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <link rel="icon" type="image/png" href="./cat/logo_bw.png" />
    <title>Tiffany Mao — UX Designer</title>
    <!-- Satoshi is self-hosted from /public/fonts/satoshi — no webfont CDN. -->
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/satoshi/Satoshi-500.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/satoshi/Satoshi-400.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
