<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tiffany Mao — UX Designer</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect.
      // Serves as the 404 page; encodes the requested path into a query
      // string and redirects to the app root, where index.html restores it.
      // pathSegmentsToKeep = 0 because the site is hosted at the domain root
      // (Vite base is '/'). Set to 1 if ever moved to a project subpath.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
